name: Nasazení na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ať se nasazení nepřekrývají — vždy vyhraje to nejnovější.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4

      - name: Připravit Pages
        uses: actions/configure-pages@v5

      - name: Zabalit celou složku
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Nasadit
        id: deployment
        uses: actions/deploy-pages@v4
